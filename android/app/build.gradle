plugins {
    id 'com.android.application'
}

def webDistDir = file("${rootDir}/../dist")
def keystorePropsFile = file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.ravikafle.toolkit'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ravikafle.toolkit'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // When no local keystore is present (e.g. F-Droid's build server)
            // the APK is left unsigned and signed downstream by F-Droid.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Bundle the built web app (npm run build -> ../dist) into the APK assets.
tasks.register('copyWebAssets', Copy) {
    from webDistDir
    into "${projectDir}/src/main/assets/web"
    doFirst {
        if (!new File(webDistDir, 'index.html').exists()) {
            throw new GradleException(
                "Missing ${webDistDir}/index.html – run `npm ci && npm run build` first.")
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
